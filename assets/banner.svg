<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="terminalWindowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.22; }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }
      .floating-pill-1 {
        animation: floatSlow1 5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 6s ease-in-out infinite;
      }
      .grid-lines {
        animation: pulseGrid 4s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 40, 60;
        animation: streamFlow 12s linear infinite;
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Grid Pattern -->
  <g class="grid-lines" stroke="#38bdf8" stroke-width="0.8">
    <line x1="80" y1="0" x2="80" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="320" y1="0" x2="320" y2="380" />
    <line x1="440" y1="0" x2="440" y2="380" />
    <line x1="560" y1="0" x2="560" y2="380" />
    <line x1="680" y1="0" x2="680" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="920" y1="0" x2="920" y2="380" />
    <line x1="1040" y1="0" x2="1040" y2="380" />
    <line x1="1160" y1="0" x2="1160" y2="380" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Circuit Streamlines (behind window) -->
  <path class="stream-line" d="M 50,180 Q 250,90 500,180 T 950,180 T 1150,100" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4" />
  <path class="stream-line" d="M 50,260 Q 300,340 600,260 T 1000,280 T 1150,220" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3" />

  <!-- Central Terminal Container Window -->
  <rect x="110" y="42" width="980" height="296" rx="14" fill="url(#terminalWindowGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#subtleGlow)" />

  <!-- Window Header Bar -->
  <rect x="110" y="42" width="980" height="42" rx="14" fill="#0f172a" fill-opacity="0.9" />
  <!-- Crisp window bottom corner fix -->
  <rect x="110" y="70" width="980" height="14" fill="#0f172a" fill-opacity="0.9" />
  <line x1="110" y1="84" x2="1090" y2="84" stroke="#334155" stroke-width="1" />

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="140" cy="63" r="6.5" fill="#ef4444" />
  <circle cx="162" cy="63" r="6.5" fill="#f59e0b" />
  <circle cx="184" cy="63" r="6.5" fill="#10b981" />

  <!-- Window Title / Command Bar -->
  <text x="600" y="67" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500" class="mono-text">
    ishandutta2007/Awesome-Terminal-Emulators — zsh 80×24
  </text>

  <!-- Foreground Content: Unobstructed Title & Details -->
  <!-- Command Prompt line -->
  <g class="mono-text">
    <text x="145" y="122" fill="#34d399" font-size="16" font-weight="bold">➜</text>
    <text x="168" y="122" fill="#38bdf8" font-size="16" font-weight="600">~</text>
    <text x="185" y="122" fill="#f8fafc" font-size="15" font-weight="500">git clone https://github.com/ishandutta2007/Awesome-Terminal-Emulators</text>
    <rect class="cursor" x="805" y="108" width="8" height="17" fill="#38bdf8" rx="1" />
  </g>

  <!-- Main Title (Strictly Foreground, Crisp & Vibrant) -->
  <text x="600" y="186" text-anchor="middle" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="1.5" class="sans-text" filter="url(#subtleGlow)">
    AWESOME TERMINAL EMULATORS
  </text>

  <!-- Subtitle (Clear, readable, unaffected by background elements) -->
  <text x="600" y="224" text-anchor="middle" fill="#cbd5e1" font-size="16.5" font-weight="500" letter-spacing="0.4" class="sans-text">
    Curated Hub of Modern CLI Workflows, GPU-Accelerated Emulators &amp; Cloud Terminals
  </text>

  <!-- Foreground Feature Badges (Bottom row inside terminal window) -->
  <g transform="translate(195, 256)" class="mono-text">
    <!-- Tag 1 -->
    <g class="floating-pill-1">
      <rect x="0" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="67" y="20" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">⚡ GPU Render</text>
    </g>
    <!-- Tag 2 -->
    <g class="floating-pill-2" transform="translate(155, 0)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <text x="75" y="20" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">🦀 Rust &amp; Modern C++</text>
    </g>
    <!-- Tag 3 -->
    <g class="floating-pill-1" transform="translate(325, 0)">
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
      <text x="72" y="20" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">🤖 AI-Native CLI</text>
    </g>
    <!-- Tag 4 -->
    <g class="floating-pill-2" transform="translate(490, 0)">
      <rect x="0" y="0" width="155" height="32" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" />
      <text x="77" y="20" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="600">💻 Cross-Platform</text>
    </g>
    <!-- Tag 5 -->
    <g class="floating-pill-1" transform="translate(665, 0)">
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="72" y="20" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">🎨 Sixel &amp; Ligatures</text>
    </g>
  </g>
</svg>
